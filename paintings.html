<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paintings &amp; Sculptures — bohlae</title>
  <meta name="robots" content="noimageindex">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Spatial overrides only — paintings page */
    .paintings-content {
      max-width: 1100px;
      padding: 48px 40px 80px;
    }
    .paintings-row {
      margin-bottom: 56px;
    }
    .pw-portrait {
      max-width: 32%;
      margin: 0 auto 56px;
    }
    .pw-portrait img {
      width: 100%;
      height: auto;
      display: block;
    }
    .pw-landscape-row {
      display: flex;
      flex-direction: row;
      gap: 10px;
      max-width: 75%;
      margin: 0 auto 10px;
      align-items: stretch;
    }
    .pw-landscape-row img {
      flex: 1 1 0;
      min-width: 0;
      object-fit: cover;
      display: block;
      height: 220px;
    }
    @media (max-width: 768px) {
      .paintings-content {
        padding: 20px 12px 48px;
      }
      .paintings-row { margin-bottom: 36px; }
      .pw-portrait {
        max-width: 100%;
        margin: 0 0 36px;
      }
      .pw-landscape-row {
        flex-wrap: wrap;
        max-width: 100%;
        gap: 6px;
      }
      .pw-landscape-row img {
        flex: 1 1 calc(50% - 3px);
        height: 140px;
      }
    }
  </style>
</head>
<body>

<div class="paintings-layout">

  <header class="topbar">
    <a href="index.html" class="topbar-name">bohlae</a>
    <nav class="topbar-nav">
      <div class="nav-dropdown">
        <span class="nav-dropdown-label">Projects</span>
        <div class="nav-dropdown-menu">
          <a href="projects/pare.html">Pare</a>
          <a href="projects/regrowth.html">Regrowth</a>
          <a href="projects/railway.html">Along the Railway</a>
        </div>
      </div>
      <a href="about.html">Bio and Info</a>
      <a href="paintings.html">Paintings &amp; Sculptures</a>
    </nav>
  </header>

  <div class="paintings-content">

    <!-- ── Sculptures ── -->
    <div class="paintings-row">
      <img src="images/paintings/sculpture_00.webp" alt="Untitled I" width="8368" height="5584">
      <div class="paintings-caption">Untitled I — [medium, year]</div>
    </div>

    <div class="paintings-row">
      <img src="images/paintings/sculpture_01.webp" alt="Untitled" width="8368" height="5584">
    </div>

    <div class="paintings-row">
      <video controls muted preload="metadata" poster="images/paintings/video-cover.webp">
        <source src="images/paintings/sculpture_02.MP4" type="video/mp4">
      </video>
      <div class="paintings-caption">Untitled — [description, year]</div>
    </div>

    <!-- ── Painting 06 ── -->
    <div class="pw-portrait">
      <img src="images/paintings/painting_06.webp" alt="Oil on canvas">
      <div class="paintings-caption">Oil on canvas</div>
    </div>

    <!-- ── Painting 07 (figurative) — uncomment when file is added
    <div class="pw-portrait">
      <img src="images/paintings/painting_07.webp" alt="Oil on canvas">
      <div class="paintings-caption">Oil on canvas</div>
    </div>
    -->

    <!-- ── Painting 05 ── -->
    <div class="pw-portrait">
      <img src="images/paintings/painting_05.webp" alt="Oil on canvas">
      <div class="paintings-caption">Oil on canvas</div>
    </div>

    <!-- ── Landscape series (4 across) ── -->
    <div class="pw-landscape-row">
      <img src="images/paintings/painting_01.webp" alt="Landscape, oil on canvas">
      <img src="images/paintings/painting_02.webp" alt="Landscape, oil on canvas">
      <img src="images/paintings/painting_03.webp" alt="Landscape, oil on canvas">
      <img src="images/paintings/painting_04.webp" alt="Landscape, oil on canvas">
    </div>
    <div class="paintings-caption" style="max-width:75%;margin-left:auto;margin-right:auto;">Oil on canvas</div>

  </div>

</div>

<script src="js/main.js"></script>
</body>
</html>
